<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Grid — P5.js Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script src="colors.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <!-- ── サイドバー ── -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>Motion Grid</h1>
      <p class="subtitle">P5.js Viewer</p>
    </div>

    <!-- アスペクト比コントロール -->
    <div id="aspect-controls">
      <label for="aspect-select">Aspect Ratio</label>
      <select id="aspect-select">
        <option value="1:1">1 : 1</option>
        <option value="16:9" selected>16 : 9</option>
        <option value="9:16">9 : 16</option>
        <option value="4:3">4 : 3</option>
        <option value="3:4">3 : 4</option>
        <option value="21:9">21 : 9</option>
        <option value="custom">Custom…</option>
      </select>

      <div id="custom-aspect" class="hidden">
        <input type="number" id="aspect-w" min="1" max="100" value="16" placeholder="W">
        <span class="colon">:</span>
        <input type="number" id="aspect-h" min="1" max="100" value="9"  placeholder="H">
      </div>

      <div id="resolution-display">
        <span id="res-label">1280 × 720</span>
      </div>
    </div>

    <!-- 表示モード -->
    <div id="mode-controls">
      <label>View Mode</label>
      <div id="mode-toggle">
        <button id="mode-single" class="active">Single</button>
        <button id="mode-grid">Grid</button>
      </div>

      <div id="grid-options" class="hidden">
        <button id="btn-shuffle-layout">Shuffle Layout</button>
        <div id="count-control">
          <label for="grid-count">Cells</label>
          <input type="number" id="grid-count" min="1" max="64" value="8">
        </div>
      </div>
    </div>

    <!-- スケッチ一覧 -->
    <div id="sketch-list-header">
      <h2>Sketches</h2>
      <span id="sketch-count" class="badge">0</span>
    </div>
    <ul id="sketch-list"></ul>

    <!-- 再生コントロール -->
    <div id="playback-controls">
      <button id="btn-restart" title="Restart">⟳</button>
      <button id="btn-pause"   title="Pause / Play">❚❚</button>
    </div>
  </aside>

  <!-- ── キャンバスエリア ── -->
  <main id="canvas-area">
    <div id="canvas-wrapper"></div>
    <div id="empty-state">
      <p>← スケッチを選択してください</p>
    </div>
  </main>

  <!-- 描画ファイルの読み込み（ここに追加していく） -->
  <!-- motionsフォルダ内の描画ファイルは sketch.js 側で動的に管理 -->

  <!-- メインスクリプト -->
  <script src="sketch.js"></script>
</body>
</html>
